<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Quiz App</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#141e30,#243b55);
    overflow:hidden;
    padding:20px;
}

body::before{
    content:'';
    position:absolute;
    width:400px;
    height:400px;
    background:#00f2fe;
    border-radius:50%;
    top:-120px;
    left:-100px;
    opacity:0.2;
}

body::after{
    content:'';
    position:absolute;
    width:350px;
    height:350px;
    background:#ff00cc;
    border-radius:50%;
    bottom:-120px;
    right:-100px;
    opacity:0.2;
}

.container{
    position:relative;
    width:100%;
    max-width:850px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:35px;
    color:white;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    overflow:hidden;
    animation:fade 0.8s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.start-screen,
.quiz-screen,
.result-screen{
    display:none;
}

.active{
    display:block;
}

.title{
    text-align:center;
    font-size:42px;
    margin-bottom:10px;
    font-weight:700;
    background:linear-gradient(to right,#00f2fe,#ff00cc);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    text-align:center;
    margin-bottom:25px;
    color:#ddd;
}

.btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    font-size:18px;
    font-weight:600;
    background:linear-gradient(to right,#00c6ff,#0072ff);
    color:white;
    cursor:pointer;
    transition:0.3s;
    margin-top:20px;
}

.btn:hover{
    transform:scale(1.03);
    box-shadow:0 0 20px rgba(0,198,255,0.6);
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    flex-wrap:wrap;
    gap:10px;
}

.info-box{
    background:rgba(255,255,255,0.15);
    padding:10px 18px;
    border-radius:12px;
    font-weight:600;
}

.progress-container{
    width:100%;
    height:12px;
    background:rgba(255,255,255,0.1);
    border-radius:20px;
    overflow:hidden;
    margin-bottom:25px;
}

.progress{
    width:0%;
    height:100%;
    background:linear-gradient(to right,#00f260,#0575e6);
    transition:0.5s;
}

.question{
    font-size:28px;
    font-weight:600;
    margin-bottom:25px;
    line-height:1.4;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.option{
    background:rgba(255,255,255,0.12);
    padding:18px;
    border-radius:16px;
    cursor:pointer;
    transition:0.3s;
    border:2px solid transparent;
    font-weight:500;
}

.option:hover{
    transform:translateY(-5px);
    background:rgba(255,255,255,0.2);
}

.correct{
    background:#00c853 !important;
    border-color:white;
}

.wrong{
    background:#ff1744 !important;
    border-color:white;
}

.feedback{
    text-align:center;
    font-size:24px;
    margin-top:20px;
    font-weight:700;
    min-height:35px;
}

.result-screen h2{
    text-align:center;
    font-size:38px;
    margin-bottom:20px;
}

.final-score{
    text-align:center;
    font-size:30px;
    margin-bottom:15px;
}

.performance{
    text-align:center;
    font-size:22px;
    margin-bottom:25px;
}

.history{
    margin-top:25px;
    background:rgba(255,255,255,0.08);
    padding:20px;
    border-radius:18px;
}

.history h3{
    margin-bottom:15px;
}

.history ul{
    list-style:none;
}

.history li{
    background:rgba(255,255,255,0.08);
    margin-bottom:10px;
    padding:12px;
    border-radius:10px;
}

.review{
    margin-top:25px;
}

.review-item{
    background:rgba(255,255,255,0.08);
    padding:15px;
    border-radius:12px;
    margin-bottom:15px;
}

.review-item p{
    margin:6px 0;
}

.correct-answer{
    color:#00ff95;
}

.wrong-answer{
    color:#ff6b81;
}

@media(max-width:700px){

    .options{
        grid-template-columns:1fr;
    }

    .question{
        font-size:22px;
    }

    .title{
        font-size:32px;
    }
}

</style>
</head>

<body>

<div class="container">

    <!-- START SCREEN -->

    <div class="start-screen active">

        <div class="title">QUIZ MASTER</div>

        <div class="subtitle">
            Interactive Professional Quiz Application
        </div>

        <button class="btn" onclick="startQuiz()">
            Start Quiz 🚀
        </button>

    </div>

    <!-- QUIZ SCREEN -->

    <div class="quiz-screen">

        <div class="top-bar">

            <div class="info-box">
                Question:
                <span id="questionNumber"></span>
            </div>

            <div class="info-box">
                Score:
                <span id="score">0</span>
            </div>

            <div class="info-box">
                Time:
                <span id="timer">15</span>s
            </div>

        </div>

        <div class="progress-container">
            <div class="progress" id="progress"></div>
        </div>

        <div class="question" id="question"></div>

        <div class="options" id="options"></div>

        <div class="feedback" id="feedback"></div>

    </div>

    <!-- RESULT SCREEN -->

    <div class="result-screen">

        <h2>Quiz Completed 🎉</h2>

        <div class="final-score">
            Final Score:
            <span id="finalScore"></span>
        </div>

        <div class="performance" id="performance"></div>

        <button class="btn" onclick="restartQuiz()">
            Play Again 🔄
        </button>

        <div class="history">

            <h3>Quiz History 📜</h3>

            <ul id="historyList"></ul>

        </div>

        <div class="review">

            <h3>Answer Review ✅❌</h3>

            <div id="reviewContainer"></div>

        </div>

    </div>

</div>

<script>

const quizData = [

{
question:"What does HTML stand for?",
options:[
"Hyper Text Markup Language",
"High Text Machine Language",
"Home Tool Markup Language",
"Hyperlinks Text Mark Language"
],
answer:"Hyper Text Markup Language"
},

{
question:"Which language is used for styling web pages?",
options:[
"Python",
"Java",
"CSS",
"C++"
],
answer:"CSS"
},

{
question:"Which company developed JavaScript?",
options:[
"Microsoft",
"Netscape",
"Apple",
"Google"
],
answer:"Netscape"
},

{
question:"Which tag is used to insert an image in HTML?",
options:[
"<img>",
"<image>",
"<pic>",
"<src>"
],
answer:"<img>"
},

{
question:"Which symbol is used for comments in JavaScript?",
options:[
"//",
"<!-- -->",
"##",
"**"
],
answer:"//"
},

{
question:"What does CSS stand for?",
options:[
"Creative Style Sheet",
"Cascading Style Sheets",
"Colorful Style Syntax",
"Computer Style Sheet"
],
answer:"Cascading Style Sheets"
},

{
question:"Which method displays output in browser console?",
options:[
"console.log()",
"print()",
"write()",
"display()"
],
answer:"console.log()"
},

{
question:"Which keyword declares a variable in JavaScript?",
options:[
"var",
"int",
"string",
"define"
],
answer:"var"
}

];

let currentQuestion = 0;
let score = 0;
let timer;
let timeLeft = 15;

let userAnswers = [];

const startScreen = document.querySelector(".start-screen");
const quizScreen = document.querySelector(".quiz-screen");
const resultScreen = document.querySelector(".result-screen");

const questionEl = document.getElementById("question");
const optionsEl = document.getElementById("options");
const feedbackEl = document.getElementById("feedback");

function startQuiz(){

    startScreen.classList.remove("active");
    quizScreen.classList.add("active");

    loadQuestion();
}

function loadQuestion(){

    resetTimer();

    feedbackEl.innerHTML = "";

    const q = quizData[currentQuestion];

    document.getElementById("questionNumber").innerText =
        `${currentQuestion + 1}/${quizData.length}`;

    questionEl.innerText = q.question;

    optionsEl.innerHTML = "";

    q.options.forEach(option => {

        const div = document.createElement("div");

        div.classList.add("option");

        div.innerText = option;

        div.onclick = () => checkAnswer(div,option);

        optionsEl.appendChild(div);

    });

    updateProgress();
}

function checkAnswer(element,selected){

    clearInterval(timer);

    const correct = quizData[currentQuestion].answer;

    const allOptions = document.querySelectorAll(".option");

    allOptions.forEach(opt => {

        if(opt.innerText === correct){
            opt.classList.add("correct");
        }

        if(opt.innerText === selected && selected !== correct){
            opt.classList.add("wrong");
        }

        opt.style.pointerEvents = "none";
    });

    let resultText = "";

    if(selected === correct){

        score++;

        document.getElementById("score").innerText = score;

        resultText = "✅ Correct Answer!";

        playCorrect();

    }else{

        resultText = "❌ Wrong Answer!";

        playWrong();
    }

    feedbackEl.innerHTML = resultText;

    userAnswers.push({
        question:quizData[currentQuestion].question,
        selected:selected,
        correct:correct
    });

    setTimeout(() => {

        currentQuestion++;

        if(currentQuestion < quizData.length){

            loadQuestion();

        }else{

            showResult();
        }

    },2000);
}

function resetTimer(){

    clearInterval(timer);

    timeLeft = 15;

    document.getElementById("timer").innerText = timeLeft;

    timer = setInterval(() => {

        timeLeft--;

        document.getElementById("timer").innerText = timeLeft;

        if(timeLeft <= 0){

            clearInterval(timer);

            userAnswers.push({
                question:quizData[currentQuestion].question,
                selected:"No Answer",
                correct:quizData[currentQuestion].answer
            });

            currentQuestion++;

            if(currentQuestion < quizData.length){

                loadQuestion();

            }else{

                showResult();
            }
        }

    },1000);
}

function updateProgress(){

    const progress =
        (currentQuestion / quizData.length) * 100;

    document.getElementById("progress").style.width =
        progress + "%";
}

function showResult(){

    quizScreen.classList.remove("active");

    resultScreen.classList.add("active");

    document.getElementById("finalScore").innerText =
        `${score} / ${quizData.length}`;

    let percent = (score / quizData.length) * 100;

    let performanceText = "";

    if(percent >= 80){

        performanceText = "🏆 Excellent Performance!";

    }else if(percent >= 50){

        performanceText = "👍 Good Job!";

    }else{

        performanceText = "📚 Keep Practicing!";
    }

    document.getElementById("performance").innerText =
        performanceText;

    saveHistory();

    loadHistory();

    showReview();
}

function restartQuiz(){

    currentQuestion = 0;

    score = 0;

    userAnswers = [];

    document.getElementById("score").innerText = 0;

    resultScreen.classList.remove("active");

    quizScreen.classList.add("active");

    loadQuestion();
}

function saveHistory(){

    let history =
        JSON.parse(localStorage.getItem("quizHistory")) || [];

    history.push(
        `Score: ${score}/${quizData.length} | ${new Date().toLocaleString()}`
    );

    localStorage.setItem(
        "quizHistory",
        JSON.stringify(history)
    );
}

function loadHistory(){

    let history =
        JSON.parse(localStorage.getItem("quizHistory")) || [];

    let historyList =
        document.getElementById("historyList");

    historyList.innerHTML = "";

    history.reverse().slice(0,5).forEach(item => {

        const li = document.createElement("li");

        li.innerText = item;

        historyList.appendChild(li);

    });
}

function showReview(){

    const reviewContainer =
        document.getElementById("reviewContainer");

    reviewContainer.innerHTML = "";

    userAnswers.forEach(item => {

        const div = document.createElement("div");

        div.classList.add("review-item");

        div.innerHTML = `

        <p><strong>Question:</strong> ${item.question}</p>

        <p class="${
            item.selected === item.correct
            ? 'correct-answer'
            : 'wrong-answer'
        }">

        <strong>Your Answer:</strong>
        ${item.selected}

        </p>

        <p class="correct-answer">

        <strong>Correct Answer:</strong>
        ${item.correct}

        </p>

        `;

        reviewContainer.appendChild(div);
    });
}

function playCorrect(){

    const audio = new Audio(
    "https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
    );

    audio.play();
}

function playWrong(){

    const audio = new Audio(
    "https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"
    );

    audio.play();
}

</script>

</body>
</html>
